[project]
name = "ostinote"
version = "1.0.0"
description = "Continuous memory for coding agents — Claude Code and Codex CLI, one shared memory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Adrien Kohlbecker", email = "adrien.kohlbecker@gmail.com" },
]
keywords = ["claude-code", "codex", "coding-agents", "memory", "llm", "hooks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/adrienkohlbecker/ostinote"
Repository = "https://github.com/adrienkohlbecker/ostinote"
Issues = "https://github.com/adrienkohlbecker/ostinote/issues"
Changelog = "https://github.com/adrienkohlbecker/ostinote/releases"
Security = "https://github.com/adrienkohlbecker/ostinote/security/policy"

[project.scripts]
ostinote = "ostinote.cli:main"

# PEP 735 dependency groups: repo-local tooling, not published as extras.
# Exact versions are pinned by uv.lock; run via `uv run --locked`.
[dependency-groups]
# pyright[nodejs] bundles the Node runtime as a locked wheel instead of
# fetching one from the network on first run.
dev = ["pytest", "pytest-timeout", "ruff", "pyright[nodejs]"]
release = ["twine"]

[build-system]
# >=77 needed for PEP 639 SPDX license expression / license-files
# The exact backend version is part of the release supply chain; bump it deliberately.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ostinote*"]

[tool.setuptools.package-data]
ostinote = ["prompts/*.txt", "assets/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # import sorting
    "B",  # bugbear
    "UP", # pyupgrade
    "D",  # pydocstyle — the repo convention requires function docstrings
]
ignore = [
    "UP031", # printf-style formatting — used deliberately throughout
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

# Pylance is built on pyright, so this keeps CLI checks aligned with the editor.
[tool.pyright]
include = ["ostinote", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = ["functional: end-to-end subprocess tests of the real CLI"]
filterwarnings = ["error"]
# Kill (not just diagnose) a hung test — e.g. a stdin-blocked subprocess or a
# lock deadlock — before it pins a CI runner for the job-level timeout;
# pytest-timeout dumps every thread's traceback as it fails the test.
timeout = 120
tmp_path_retention_policy = "failed"
