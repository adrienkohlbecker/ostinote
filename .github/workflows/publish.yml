name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: "0.11.16"
          python-version: "3.14"
      - run: uv run --locked --group dev ruff check --output-format=github .
      - run: uv run --locked --group dev ruff format --check .

  validate-test:
    name: validate test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python }}
      - run: uv run --locked --group dev pytest -q --durations=10

  build:
    needs: [validate-lint, validate-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: "0.11.16"
          python-version: "3.14"
      - name: Check release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # The release tag must match the built version: a stale pyproject.toml
      # would otherwise publish the wrong version irrevocably (PyPI version
      # numbers cannot be reused).
      - name: Check tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -I -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          tag="$RELEASE_TAG"
          if [ "${tag#v}" != "$version" ]; then
            printf 'Release tag %s does not match project version %s\n' "$tag" "$version" >&2
            exit 1
          fi
      - run: uv build
      - run: uv run --locked --only-group release twine check --strict dist/*
      - name: Smoke-test built distributions
        run: |
          python3 - <<'PY'
          import subprocess
          import tarfile
          import tempfile
          from pathlib import Path

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, got {wheels!r} and {sdists!r}")

          def run(*args: str) -> None:
              subprocess.run(args, check=True)

          run("uv", "run", "--isolated", "--with", str(wheels[0]), "--no-project", "ostinote", "--version")

          with tempfile.TemporaryDirectory() as tmp:
              tmpdir = Path(tmp)
              with tarfile.open(sdists[0], "r:gz") as archive:
                  archive.extractall(tmpdir, filter="data")
              sources = [path for path in tmpdir.iterdir() if path.is_dir()]
              if len(sources) != 1:
                  raise SystemExit(f"expected one extracted sdist directory, got {sources!r}")
              rebuilt = tmpdir / "wheel"
              run("uv", "build", "--wheel", "--out-dir", str(rebuilt), str(sources[0]))
              rebuilt_wheels = sorted(rebuilt.glob("*.whl"))
              if len(rebuilt_wheels) != 1:
                  raise SystemExit(f"expected one rebuilt wheel, got {rebuilt_wheels!r}")
              run("uv", "run", "--isolated", "--with", str(rebuilt_wheels[0]), "--no-project", "ostinote", "--version")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ostinote
    permissions:
      contents: read
      # Required for PyPI Trusted Publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
