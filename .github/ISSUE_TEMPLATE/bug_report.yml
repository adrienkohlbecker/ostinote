name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent(s)
      multiple: true
      options:
        - Claude Code
        - Codex CLI
        - Other / N/A
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Public issues need only the smallest relevant, redacted snippet. Useful
        sources are `logs/memory-<date>.log` and `logs/background.log` inside
        the data dir (default `~/.ostinote/projects/<slug>/`) plus
        `~/.ostinote/hook-errors.log`. Log lines can contain session summaries,
        local paths, prompts, or secrets; report vulnerabilities or sensitive
        diagnostics privately via the security policy instead of pasting them
        here.
      render: text
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: "`ostinote --version` output, OS, Python, and relevant agent CLI version(s)"
    validations:
      required: true
